<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4-10多個矩形繪製練習 + 4-11陽春版長條圖繪製練習</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
  </head>
  <body>
    <script>
      let svg = d3
        .select("body")
        .append("svg")
        .attr("width", 800)
        .attr("height", 600)
        .attr("id", "barChart");

      for (let i = 0; i < 20; i++) {
        let num = random(20, 300);
        svg
          .append("rect")
          .attr("x", 10)
          .attr("y", 10 + 12 * i)
          .attr("width", num)
          .attr("height", 10)
          .attr("fill", "red");
        svg
          .append("text")
          .text(num.toString())
          .attr("x", num + 15)
          .attr("y", 10 + 12 * i + 10)
          .attr("font-size", 12);
      }

      function random(n, m) {
        return Math.ceil(Math.random() * (m - n) + n);
      }
    </script>
  </body>
</html>
