<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4-12陽春版折線圖繪製練習</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
  </head>
  <body>
    <script>
      let svg = d3
        .select("body")
        .append("svg")
        .attr("width", 800)
        .attr("height", 600)
        .attr("id", "barChart");

      let last_num = 0;
      let i = 0
      for (i = 0; i < 20; i++) {
        let num = random(20, 300);
        svg
          .append("line")
          .attr("x1", 10 + last_num)
          .attr("y1", 10 + 12 * (i - 1) + 5)
          .attr("x2", 10 + num)
          .attr("y2", 10 + 12 * i + 5)
          .attr("stroke", "gray");

        svg
          .append("circle")
          .attr("cx", 10 + num)
          .attr("cy", 10 + 12 * i + 5)
          .attr("r", 3)
          .attr("fill", "red");
        svg
          .append("text")
          .text(num.toString())
          .attr("x", num + 15)
          .attr("y", 10 + 12 * i + 10)
          .attr("font-size", 12);

        last_num = num;
      }

      svg
        .append("line")
        .attr("x1", 10 + last_num)
        .attr("y1", 10 + 12 * (i - 1) + 5)
        .attr("x2", 10 + 0)
        .attr("y2", 10 + 12 * i + 5)
        .attr("stroke", "gray");

      function random(n, m) {
        return Math.ceil(Math.random() * (m - n) + n);
      }
    </script>
  </body>
</html>
