<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7-3-2 比例尺的 clamp() 左右夾緊</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
</head>
<body>
  <script>
    // domain: input
    // range: ouput
    // clamp(true/false) => 設定成 true，則經過縮放的值將不會超過指定範圍，超過則會以最小值、最大值呈現

    // 「等比例縮小」
    var xScale1 = d3.scale.linear().domain([0, 1000]).range([0, 100]).clamp(true);

    console.log("========「等比例縮小」=======");
    console.log(xScale1(455)); // output: 45.5
    console.log(xScale1(4550)); // output: 100
    console.log(xScale1(-4550)); // output: 0


    // 「等比例放大」
    var xScale1 = d3.scale.linear().domain([0, 100]).range([0, 1000]).clamp(true);

    console.log("========「等比例放大」=======");
    console.log(xScale1(45)); // output: 450
    console.log(xScale1(455)); // output: 1000
    console.log(xScale1(4550)); // output: 1000
    console.log(xScale1(-4550)); // output: 0
  </script>
</body>
</html>
