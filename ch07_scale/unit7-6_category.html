<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7-6 填色序數比例尺</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
  </head>
  <body>
    <script>
      // category10() => 10種顏色
      // category20() => 20種顏色
      // category20b() => 20種顏色，深色
      // category20c() => 20種顏色，淺色
      let fScale = d3.scale.category20();

      // 預設是會用認領的方式取得顏色，否則會是依序取用顏色
      // 以此例來說，即使輸入的是9，也會是取用填色序數比例尺的第一個顏色，因為它是最初出現的顏色
      // 可以想像它就是個佇列(queue)，前面的顏色就會先被使用
      console.log(fScale(9)); // output: #1f77b4
      console.log(fScale(2)); // output: #aec7e8
      console.log(fScale("3")); // output: #ff7f0e

      // 可以透過超過20筆顏色的時候，來觀察預設的20色次序
      for (let i = 0; i < 40; i++) {
        d3.select("body")
          .append("div")
          // 可以使用 classed，設定是否加入此 css class
          .classed("ball", true)
          .style({
            "background-color": fScale(i),
          });

        if (i === 19) {
          d3.select("body").append("div");
        }
      }
    </script>
  </body>
</html>
