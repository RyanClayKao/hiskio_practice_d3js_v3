<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10-4 載入台灣地圖的 topo json格式檔，並且進行綁定；繪製登革熱疫情點位置圖</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
  <script src="./topojson.min.js"></script>
  <style>
    .map-boundary{
      stroke: #eee;
    }
  </style>
</head>
<body>
  <svg width="1200" height="700"></svg>

  <script>
    // 2. 地理投影器：
    //    設定投影方式：麥卡托、定位器（[經度,緯度])、縮放(scale)
    var projection = d3.geo.mercator().center([121, 24]).scale(8000);

    // 1.載入地圖 GeoJSON格式資料檔 
    d3.json("../data/DengueLast12.json", function(dataSet){
      console.log(dataSet);

      d3.json('../data/taiwan-map-topo.json',function(mapDataSet){
        bind(mapDataSet, dataSet);
        render();
      });
    })

    function bind(topoRoot, dataSet){
      
      // 3. 路徑產生器： d3.geo.path()
      var path = d3.geo.path().projection(projection);

      // console.log(topoRoot);

      // 4.地理資料檔: 使用topojson.js載入地理資料
      // objects的傳入值，可以透過 console.log(topoRoot) 來查看
      var geoRoot = topojson.feature(topoRoot, topoRoot.objects["COUNTY_MOI_1140318"]);

      // 綁定 path與各地理區塊
      var selection = d3.select("svg").selectAll("path").data(geoRoot.features);
              
      selection.enter().append("path").classed("map-boundary", true).attr("d", path);
      selection.exit().remove();


      // 綁定登革熱疫情點 circle
      var selection_circle = d3.select("svg").selectAll("circle").data(dataSet);              
      selection_circle.enter().append("circle");
      selection_circle.exit().remove();
    }

    function render(){
      var fScale = d3.scale.category20();
      var tmp_color;

      d3.selectAll("path")
        .attr("fill", function(d, i){
          // return fScale(i);
          return "black";
        });

      // 查看 project投影(比例尺)，基於傳入的經緯度，所回傳的 x, y值
      console.log(projection([121, 25]));

      d3.selectAll("circle")
        .attr("cx", function(d){
          return projection([d["最小統計區中心點X"], d["最小統計區中心點Y"]])[0];
        })
        .attr("cy", function(d){
          return projection([d["最小統計區中心點X"], d["最小統計區中心點Y"]])[1];
        })
        .attr("r", 2)
        .attr("fill", "yellow");
    }
  </script>
</body>
</html>
