<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>8-12 無軸線版2D散佈圖，加上軸線，再做資料彙整處理，加入「下拉選單」的事件綁定，調整坐標軸的寫法，加入自製的提示框；改用癌症初發生年齡資料
    </title>
    <script src="https://d3js.org/d3.v3.js"></script>
    <style>
        body{
            background: #eee;
        }

        /* path 指的是軸線 */
        /* line 指的是標記線 */
        /* text 則是標記值 */
        .axis path, 
        .axis line {
            fill: none;
            stroke: black;
            shape-rendering: auto;
        }

        .axis text {
            font-size: 11px;
            fill: black;
        }

        #tooltip {
            position: absolute;
            background-color: #fff;
            width: 150px;
            height: auto;
            padding: 0px 10px;
            border-radius: 10px;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.3);
        }

        #tooltip.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="tooltip" class="hidden">
        <p>
            <strong id="city">Hello</strong>
        </p>
        <p id="content">tooltip</p>
    </div>

    <script>
        // 1. 定義width, height, padding
        var w = 900;
        var h = 600;
        var top_bottom_padding = 60;
        var left_right_padding = 100;
        
        //2. 建立svg()畫布環境
        
        svg();       
        
        //3. 用d3讀取csv
        //   
        d3.csv("../data/cancer_data.csv", mid, function(dataSet){
            
            bind(dataSet);
            render(dataSet);
            btnList(dataSet);
        });

        function mid(d){
            d.age_occur_rate_per_hundred_thousand = +d.age_occur_rate_per_hundred_thousand;
            d.cancer_occur_num = +d.cancer_occur_num;
            d.avg_age = +d.avg_age;
            d.middle_age = +d.middle_age;
            d.rude_rate = +d.rude_rate;
            return d;
        }
        
        
        function svg(){
            d3.select("body").append("svg").attr("width", w).attr("height", h);
            d3.select("svg").append("g").append("rect").attr({
                width: "100%",
                height: "100%",
                fill: "white"
            });

            d3.select('svg').append('g').classed("axis", true).attr("id", "axisX");

            d3.select('svg').append('g').classed("axis", true).attr("id", "axisY");
        }
        
        //4. 建立bind()

        function bind(dataSet){
            var selection = d3.select("svg")
                                .selectAll("circle")
                                .data(dataSet);
            
            selection.enter().append("circle");
            selection.exit().remove();
        }
        
        function render(dataSet){
            //5. 定義xScale,yScale,rScale, fScale比例尺(range目的在決定在svg上位置)
            
            
            // 粗率 (每10萬人會發生的機率)
            var xScale = d3.scale.linear()
                            .domain([
                                0,
                                d3.max(dataSet, function(d){
                                    return d.rude_rate;
                                }),
                            ])
                            .range([left_right_padding, w - left_right_padding]);
            // 平均年齡
            var yScale = d3.scale.linear()
                        .domain([
                            0,
                            d3.max(dataSet, function(d) {
                                return d.avg_age
                            })
                        ])
                        .range([h - top_bottom_padding, top_bottom_padding]);
            // 癌症發生數
            var rScale = d3.scale.linear()
                        .domain([
                            d3.min(dataSet, function(d){
                                return d.cancer_occur_num;
                            }),
                            d3.max(dataSet, function(d) {
                                return d.cancer_occur_num;
                            })
                        ])
                        .range([5, 30]); // 自訂圓球大小
            // 縣市 => 以顏色輸出
            var fScale = d3.scale.category20();

            // X軸線
            var xAxis = d3
                        .svg
                        .axis()
                        .scale(xScale)
                        .orient("bottom")
                        .ticks(12); // 刻度設定，只是參考值，實際上還是由 d3.js自己控制，不全然是真的會呈現一模一樣的刻度數量

            // Y軸線
            var yAxis = d3.svg.axis().scale(yScale).orient("left");
                
            //6. 建立render()繪圖
            d3.selectAll("circle")
                .transition()
                .attr("cx", function(d) {
                    return xScale(d.rude_rate);
                })
                .attr("cy", function(d) {
                    return yScale(d.avg_age);
                })
                .attr("r", function(d) {
                    return rScale(d.cancer_occur_num);
                })
                .attr("fill", function(d){
                    return fScale(d.city);
                })
                ;

            d3.selectAll("circle")
                .on("mouseover", function(d){
                    let positionX = d3.select(this).attr("cx");
                    let positionY = d3.select(this).attr("cy");
                    // console.log(positionX, positionY);

                    let tooltip = d3.select("#tooltip")
                                    .style({
                                    "left": (+positionX + 20) + "px",
                                    "top": (+positionY + 20) + "px",
                                });

                    tooltip.select("#city").text(d.city);
                    tooltip.select("#content").html(d.cancer_type + "<br />案例數:" + d.cancer_occur_num);
                    tooltip.classed("hidden", false);
                })
                .on("mouseout", function(d) {
                    d3.select("#tooltip").classed("hidden", true);
                })

            // 畫軸線
            // X軸
            d3.select('svg>#axisX').attr('transform', `translate(0, ${ h - top_bottom_padding + 20})`).call(xAxis);
            // Y軸
            d3.select('svg>#axisY').attr("transform", `translate(${left_right_padding - 20} ,0)`).call(yAxis);
        }
        
        function unique(arr){
            let n = [];

            for(let i = 0; i < arr.length; i++){
                if (n.indexOf(arr[i]) === -1){
                n.push(arr[i]);
                }
            }

            return n;
        }

        function btnList(dataSet){
            let cancerTypeArr = dataSet.map(item => item.cancer_type);
            // 去除重複
            let uni_cancerTypeArr = unique(cancerTypeArr);
            // 去除空字串
            let filtered_cancerTypeArr = uni_cancerTypeArr.filter(item => item != "");            
            // console.log(filtered_cancerTypeArr);

            // select part 1 ----------------
            let selection = d3.select("body").append("select").selectAll("option").data(filtered_cancerTypeArr);
            selection.enter()
                    .append("option")
                    .append("value", function(d) {
                        return d;
                    })
                    .text(function(d) {
                        return d;
                    });

            selection.exit().remove();

            // select part 2 ----------------
            d3.select("select").on("change", function(){
                let value = d3.select("select").property("value");
                update(value);
            })

            // ------------------------------
            function update(cancer_type){
                let newDataSet = dataSet.filter(item => item.cancer_type === cancer_type);
                bind(newDataSet);
                render(newDataSet);
            }
        }


    </script>

</body>
</html>
