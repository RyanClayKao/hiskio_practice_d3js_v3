<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>8-7 無軸線版2D散佈圖，加上軸線，再做資料彙整處理，加入「下拉選單」的事件綁定，調整坐標軸的寫法
    </title>
    <script src="https://d3js.org/d3.v3.js"></script>
    <style>
        body{
            background: #eee;
        }

        /* path 指的是軸線 */
        /* line 指的是標記線 */
        /* text 則是標記值 */
        .axis path, 
        .axis line {
            fill: none;
            stroke: black;
            shape-rendering: auto;
        }

        .axis text {
            font-size: 11px;
            fill: black;
        }
    </style>
</head>
<body>
    <script>
        // 1. 定義width, height, padding, letterList變數
        var w = 900;
        var h = 600;
        var top_bottom_padding = 60;
        var left_right_padding = 100;
        var letterList = ["A","B","C","D","E","F","G","H","I","J","K","M","N","O","P","Q","T","U","V","W","X","Z"];
        
        //2. 建立svg()畫布環境
        
        svg();       
        
        //3. 用d3讀取csv
        d3.csv("../data/invoice.csv", mid, function(dataSet){
            
            bind(dataSet);
            render(dataSet);
            btnList(dataSet);
        });

        function mid(d){
            d.number = +d.number;
            d.amount = +d.amount;
            return d;
        }
        
        
        function svg(){
            d3.select("body").append("svg").attr("width", w).attr("height", h);
            d3.select("svg").append("g").append("rect").attr({
                width: "100%",
                height: "100%",
                fill: "white"
            });

            d3.select('svg').append('g').classed("axis", true).attr("id", "axisX");

            d3.select('svg').append('g').classed("axis", true).attr("id", "axisY");
        }
        
        //4. 建立bind()

        function bind(dataSet){
            var selection = d3.select("svg")
                                .selectAll("circle")
                                .data(dataSet);
            
            selection.enter().append("circle");
            selection.exit().remove();
        }
        
        function render(dataSet){
            //5. 定義xScale,yScale,rScale, fScale比例尺(range目的在決定在svg上位置)
            
            
            // 日期
            var xScale = d3.time.scale()
                            .domain([
                                new Date(d3.min(dataSet, function(d){
                                    return d.date;
                                })),
                                new Date(d3.max(dataSet, function(d){
                                    return d.date;
                                }))
                            ])
                            .range([left_right_padding, w - left_right_padding]);
            // 發票數量
            var yScale = d3.scale.linear()
                        .domain([
                            0,
                            d3.max(dataSet, function(d) {
                                return d.number
                            })
                        ])
                        .range([h - top_bottom_padding, top_bottom_padding]);
            // 金額
            var rScale = d3.scale.linear()
                        .domain([
                            d3.min(dataSet, function(d){
                                return d.amount;
                            }),
                            d3.max(dataSet, function(d) {
                                return d.amount;
                            })
                        ])
                        .range([5, 10]); // 自訂圓球大小
            // 縣市 => 以顏色輸出
            var fScale = d3.scale.category20();

            // X軸線
            var xAxis = d3
                        .svg
                        .axis()
                        .scale(xScale)
                        .orient("bottom")
                        .ticks(12); // 刻度設定，只是參考值，實際上還是由 d3.js自己控制，不全然是真的會呈現一模一樣的刻度數量

            // Y軸線
            var yAxis = d3.svg.axis().scale(yScale).orient("left").tickFormat(function(d) {
                return (d / 1000000)  + "M";
            });
                
            //6. 建立render()繪圖
            d3.selectAll("circle")
                .attr("cx", function(d) {
                    return xScale(new Date(d.date));
                })
                .attr("cy", function(d) {
                    return yScale(d.number);
                })
                .attr("r", function(d) {
                    return rScale(d.amount);
                })
                .attr("fill", function(d){
                    return fScale(d.cid);
                })
                ;

            // 畫軸線
            // X軸
            d3.select('svg>#axisX').attr('transform', `translate(0, ${ h - top_bottom_padding + 20})`).call(xAxis);
            // Y軸
            d3.select('svg>#axisY').attr("transform", `translate(${left_right_padding - 20} ,0)`).call(yAxis);
        }
        
        function unique(arr){
            let n = [];

            for(let i = 0; i < arr.length; i++){
                if (n.indexOf(arr[i]) === -1){
                n.push(arr[i]);
                }
            }

            return n;
        }

        function btnList(dataSet){
            let industryArr = dataSet.map(item => item.industry);
            // 去除重複
            let uni_industryArr = unique(industryArr);
            // 去除空字串
            let filtered_industryArr = uni_industryArr.filter(item => item != "");            
            // console.log(filtered_industryArr);

            // select part 1 ----------------
            let selection = d3.select("body").append("select").selectAll("option").data(filtered_industryArr);
            selection.enter()
                    .append("option")
                    .append("value", function(d) {
                        return d;
                    })
                    .text(function(d) {
                        return d;
                    });

            selection.exit().remove();

            // select part 2 ----------------
            d3.select("select").on("change", function(){
                let value = d3.select("select").property("value");
                update(value);
            })

            // ------------------------------
            function update(industryName){
                let newDataSet = dataSet.filter(item => item.industry === industryName);
                bind(newDataSet);
                render(newDataSet);
            }

            // d3.select("body").append("span").text(filtered_industryArr);
        }


    </script>

</body>
</html>
