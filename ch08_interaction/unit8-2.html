<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-2 js 簡單的一維陣列去除重複</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
</head>
<body>
  <script>
    let arr1 = ["A", "B", "A", "C"];
    let arr2 = [
      {city: "台北市", cid: "A"},
      {city: "台中市", cid: "B"},
      {city: "台北市", cid: "A"},
      {city: "基隆市", cid: "C"},
    ]
    let arr3_cid = arr2.map(item => item.cid);    

    let uniArr = unique(arr1);
    console.log(uniArr);

    let arr4 = unique(arr3_cid);
    console.log(arr4);

    function unique(arr){
      let n = [];

      for(let i = 0; i < arr.length; i++){
        if (n.indexOf(arr[i]) === -1){
          n.push(arr[i]);
        }
      }

      return n;
    }
  </script>
</body>
</html>
